# Configuração do Fly.io. A diferença para o Render é o despertar:
# a máquina suspende quando ninguém usa e acorda em 1-3 segundos,
# em vez dos ~50 segundos do plano grátis do Render.
app = "receitas-laura-gabriel"
primary_region = "gru"   # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
