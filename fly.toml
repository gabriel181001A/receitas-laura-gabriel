# Fly.io. Duas escolhas importantes aqui:
#
# 1. A máquina suspende quando ninguém usa e acorda em 1-3 segundos, em vez
#    dos ~50 s do plano grátis do Render. É o que faz diferença quando ela
#    abre a lista de compras no mercado.
# 2. O banco fica num volume persistente montado em /data, então não é
#    preciso contratar banco externo — o SQLite mora ali e sobrevive a
#    cada novo deploy.
app = "receitas-laura-gabriel"
primary_region = "gru"   # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_URL = "file:/data/receitas.db"

# Disco que sobrevive aos deploys. Criar uma vez com:
#   fly volumes create receitas_data --region gru --size 1
[mounts]
  source = "receitas_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

# Com volume, uma máquina só — duas brigariam pelo mesmo disco.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
