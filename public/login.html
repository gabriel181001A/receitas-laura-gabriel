<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBE4EA">
  <title>Entrar · Receitas</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23B23A5F'/%3E%3Ctext y='72' x='50' text-anchor='middle' font-size='58'%3E🍲%3C/text%3E%3C/svg%3E">
  <style>
    body { display: grid; place-items: center; min-height: 100dvh; padding: 24px; }
    .login {
      width: 100%; max-width: 370px; position: relative;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 34px 26px;
      box-shadow: var(--shadow-lg); text-align: center;
    }
    .login-mark {
      width: 60px; height: 60px; margin: 0 auto 16px; border-radius: 17px;
      background: var(--brand); display: grid; place-items: center; font-size: 30px;
      box-shadow: var(--shadow);
    }
    .login h1 { font-size: 24px; margin-bottom: 5px; }
    .login p { color: var(--ink-3); font-size: 14px; margin-bottom: 24px; }
    .tiles {
      position: absolute; inset: 0; border-radius: var(--radius-lg); overflow: hidden;
      opacity: .4; pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, #000, transparent 45%);
      mask-image: linear-gradient(to bottom, #000, transparent 45%);
    }
  </style>
</head>
<body>
  <form class="login" id="form">
    <div class="tiles azulejo-bg"></div>
    <div class="login-mark">🍲</div>
    <h1>Receitas</h1>
    <p>Laura &amp; Gabriel</p>

    <label class="field" style="text-align:left">
      <span class="field-label">Senha da casa</span>
      <input class="input" type="password" id="pwd" autocomplete="current-password" autofocus>
    </label>

    <div class="alert alert-error" id="err" hidden></div>
    <button class="btn btn-primary btn-block" type="submit">Entrar</button>
  </form>

  <script>
    const form = document.getElementById('form');
    const err = document.getElementById('err');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      const btn = form.querySelector('button');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('pwd').value }),
        });
        if (res.ok) { location.href = '/'; return; }
        const data = await res.json().catch(() => ({}));
        err.textContent = data.error || 'Senha incorreta';
        err.hidden = false;
      } catch {
        err.textContent = 'Sem conexão com o servidor.';
        err.hidden = false;
      }
      btn.disabled = false;
      btn.textContent = 'Entrar';
    });
  </script>
</body>
</html>
