# Blueprint do Render: em vez de configurar na mão, aponte o repositório
# em render.com/blueprints e ele lê este arquivo.
services:
  - type: web
    name: receitas-laura-gabriel
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/auth/status
    envVars:
      - key: APP_PASSWORD        # a senha de vocês dois
        sync: false
      - key: SESSION_SECRET      # gerado automaticamente pelo Render
        generateValue: true
      - key: TURSO_DATABASE_URL  # libsql://... do Turso
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
